services:
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?Copie .env.example vers .env}
      DB_USER: ${DB_USER:?Copie .env.example vers .env}
      DB_PASSWORD: ${DB_PASSWORD:?Copie .env.example vers .env}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      ADMIN_NICKNAME: ${ADMIN_NICKNAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    volumes:
      - ./app:/var/www/html
      - ./database:/var/www/database:ro
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:?Copie .env.example vers .env}
      POSTGRES_USER: ${DB_USER:?Copie .env.example vers .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Copie .env.example vers .env}
    volumes:
      - foodbattle_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  foodbattle_data:
